<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&amp;family=Cinzel:wght@700&amp;display=swap');
      .title {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 44px;
        fill: #22334e;
        letter-spacing: 2px;
      }
      .subtitle {
        font-family: 'Cinzel', serif;
        font-weight: 700;
        font-size: 13px;
        fill: #22334e;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <g transform="translate(10, -5)">
    <!-- Infinity Symbol (CO) -->
    <path d="M 74 64
             C 65 52, 60 28, 46 28
             C 26 28, 18 42, 18 52
             C 18 62, 26 76, 46 76
             C 60 76, 76 56, 80 50
             C 86 42, 90 28, 106 28
             C 126 28, 134 42, 134 52
             C 134 62, 126 76, 106 76
             C 98 76, 90 71, 84 64" 
          fill="none" stroke="#22334e" stroke-width="24" stroke-linecap="butt" />

    <!-- Tagline -->
    <text x="76" y="105" text-anchor="middle" class="subtitle">INFINITE EMOTIONS</text>
  </g>

  <!-- Main Text -->
  <text x="170" y="52" class="title">CREATIONS</text>
  <text x="170" y="98" class="title">OVERSEAS</text>
</svg>
